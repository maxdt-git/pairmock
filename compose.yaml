services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/src:/app/src:Z
      - ./frontend/public:/app/public:Z
      - ./frontend/index.html:/app/index.html:Z

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend/src:/app/src:Z
